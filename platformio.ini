[platformio]
default_envs = matouch_s3_43
boards_dir = boards
[env:scanner]
extends = env:matouch_s3_43
build_src_filter = +<../test/i2c_scan/test_i2c.cpp> -<*>

[env:matouch_s3_43]
platform = espressif32
board = matouch_s3_43
framework = arduino
monitor_speed = 115200
; Prefer UART port over USB for stability (set your port if you have multiple)
; upload_port = /dev/cu.usbserial-XXXX
; monitor_port = /dev/cu.usbserial-XXXX
board_build.filesystem = littlefs

build_src_filter = +<*> -<.git/> -<.svn/> -<example/> -<examples/> -<test/> -<tests/>

lib_deps =
    lvgl/lvgl@^9.0.0
    lovyan03/LovyanGFX @ ^1.2.0
    adafruit/Adafruit PN532 @ ^1.3.0
    bblanchon/ArduinoJson @ ^7.0.0
    bblanchon/StreamUtils @ ^1.7.0
    https://github.com/tzapu/WiFiManager.git
    SPI
    Wire

build_unflags = -std=gnu++11
build_flags =
    -Iinclude
    -Isrc
    -DBOARD_MATOUCH_ESP32_S3_43
    -DARDUINO_USB_CDC_ON_BOOT=0
    -D LGFX_USE_V1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_LVGL_H_INCLUDE_SIMPLE
    -DLV_CONF_SUPPRESS_DEFINE_CHECK
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -DBOARD_MATOUCH_V2       ; V3.1: I2S audio on GPIO2(LRCLK)/GPIO19(DIN)/GPIO20(BCLK);
                              ;        backlight hardware always-on (same as V2.0).
    -DBOARD_MATOUCH_V31      ; V3.1 marker for any future V3.1-specific conditionals.

; Crucial for S3 OPI PSRAM models
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB